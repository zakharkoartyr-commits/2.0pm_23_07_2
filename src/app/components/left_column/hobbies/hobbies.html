<div class="hobbies-container" *ngIf="hobbies && hobbies.length > 0">
  <h3>HOBBIES</h3>
  
  <div class="hobbies-list">
    <div class="hobby-item" *ngFor="let hobby of hobbies">
      <div class="icon-circle">
        <i class="fas" [ngClass]="hobby.icon"></i>
      </div>
      <span>{{ hobby.name }}</span>
    </div>
  </div>
</div>
