<section class="collapsible-section">
  <div class="section-header" (click)="toggleSection()">
    <h3>EDUCATION</h3>
    <span class="arrow-icon" [class.rotated]="!isOpen">▲</span>
  </div>

  <div class="section-content" *ngIf="isOpen">
    <div class="education-grid">
      <div class="edu-item">
        <div class="major">ENTER YOUR MAJOR</div>
        <div class="university">Name Of Your University</div>
        <div class="years">2005-2009</div>
      </div>

      <div class="edu-item">
        <div class="major">ENTER YOUR MAJOR</div>
        <div class="university">Name Of Your University</div>
        <div class="years">2009-2011</div>
      </div>
    </div>
  </div>
</section>
