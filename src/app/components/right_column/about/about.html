<section class="about-section">
  <div class="header-with-toggle">
    <h3>ABOUT ME</h3>
    <button (click)="toggle()" class="toggle-btn">
      {{ isOpen ? 'Приховати' : 'Показати' }}
    </button>
  </div>

  <div class="orange-line"></div>

  @if (isOpen) {
    <div class="about-content" appearance="fade">
      <p>
        I am a creative and detail-oriented UI/UX Designer with a passion for building 
        user-friendly digital products. My goal is to bridge the gap between 
        complex technology and intuitive user experiences.
      </p>
    </div>
  } @else {
    <p class="placeholder-text">Контент приховано. Натисніть кнопку вище.</p>
  }
</section>
